name: Sync canonical GPL license

on:
  push:
    paths:
      - '.github/workflows/sync-license.yml'

permissions:
  contents: write

jobs:
  sync-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy canonical GPLv3 text
        run: curl -fsSL https://raw.githubusercontent.com/nicklausFR/obsidian-subnotes/main/LICENSE -o LICENSE
      - name: Commit license
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LICENSE
          if ! git diff --cached --quiet; then
            git commit -m "Use canonical GPL-3.0 license text"
            git push
          fi
