name: Ensure GPL license notice

on:
  push:
    paths:
      - '.github/workflows/ensure-license-readme.yml'

permissions:
  contents: write

jobs:
  ensure-license-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add license notice if missing
        run: |
          if ! grep -q '^## License$' README.md; then
            printf '\n## License\n\nCopyright (C) 2026 nicklausFR\n\nGPL-3.0-or-later. See [LICENSE](LICENSE).\n' >> README.md
          fi
      - name: Commit README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "Document GPL-3.0-or-later license"
            git push
          fi
